<div>
  <p>example of local variable for referencing DOM input field</p>
  <p>the button will trigger 'focus()' on that input field:</p>

  <!-- voorbeeld van een local variable genaamd name -->
  <input type="text" #name />
  <button (click)="name.focus()">Focus the input</button>
</div>
