<div>
    <!-- adhv boolean een css class toepassen op h1 element -->
    <h1 [ngClass]="{ 'primarycolor': isPrimaryColor, 'secondarycolor':!isPrimaryColor}">Cars: {{ carsmessage() }}</h1>
    <ul>
        @for (car of cars(); track car.id) {
            <li>{{car.id}} {{car.brandname}} {{car.modelname}} {{car.price}}</li>
        }
    </ul>
</div>
