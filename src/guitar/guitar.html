<h2>Guitar Collection</h2>

@for (item of guitarCollection | keyvalue; track item) {
    <p>{{item.key}} - {{ item.value.brandname}} {{ item.value.modelname }} has
        {{ item.value.strings}} strings and
        @if (item.value.hasActivePickups) { active pickups. }
        @else { passive pickups. }
    </p>
}
    <button (click)="DeleteGuitarTwo()">Delete guitar number 2</button>
